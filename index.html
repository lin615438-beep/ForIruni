<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給魯尼的自定義抽獎系統 Pro</title>
    <style>
        :root { --primary: #e63946; --secondary: #457b9d; --bg: #f1faee; --dark: #1d3557; --green-panel: #a8dadc; --accent: #22d3ee; }
        
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-color: var(--bg);
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background-image: url('貼貼哈士祈.png'); background-repeat: repeat; background-size: 650px; opacity: 0.15; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.98); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            width: 100%; max-width: 950px; margin-bottom: 25px; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.05);
        }

        h2 { color: var(--secondary); border-bottom: 2px solid var(--bg); padding-bottom: 10px; margin-top: 0; display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

       
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .tool-btn { 
            position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; background: #ffffff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .tool-btn:hover { background: var(--secondary); color: white; border-color: var(--secondary); }
        .tool-btn::after {
            content: attr(data-tip); position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
            padding: 5px 10px; background: rgba(0, 0, 0, 0.85); color: #fff; font-size: 12px; border-radius: 6px; white-space: nowrap;
            opacity: 0; visibility: hidden; transition: 0.2s; z-index: 10;
        }
        .tool-btn::before {
            content: ""; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
            border: 6px solid transparent; border-top-color: rgba(0, 0, 0, 0.85); opacity: 0; visibility: hidden; transition: 0.2s; z-index: 10;
        }
        .tool-btn:hover::after, .tool-btn:hover::before { opacity: 1; visibility: visible; }

       
        textarea, .prize-row input, .modal-body input[type="text"], .modal-body input[type="number"] { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; transition: border 0.2s;
        }
        textarea:focus, input:focus { border-color: var(--accent); }

        
        #nameInput, #prizeTextArea, #prizeFormContainer {
            min-height: 250px; 
        }

        
        .mode-switch-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { 
            background: #f8f8f8; border: 1px solid #ddd; padding: 6px 15px; border-radius: 20px; 
            cursor: pointer; font-size: 14px; color: #666; display: flex; align-items: center; gap: 5px; transition: 0.2s;
        }
        .mode-btn.active { background: white; border-color: var(--accent); color: var(--dark); font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px);
        }
        .modal {
            background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 420px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15); text-align: center;
        }
        .modal-header { font-size: 1.6rem; font-weight: bold; color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .modal-body { text-align: left; }
        .modal-body label { display: block; margin: 15px 0 8px; font-weight: bold; color: #555; }
        
        
        .prize-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .p-name { flex: 3; } .p-count { flex: 1; min-width: 70px; }
        .del-btn { background: #fff; color: #4db6ac; border: 1px solid #ddd; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .del-btn:hover { color: var(--primary); border-color: var(--primary); background: #fdf2f2; }
        .btn-add { background: #f8f8f8; color: #666; border: 2px dashed #ccc; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 5px; }

        
        .control-panel { background: var(--green-panel) !important; text-align: center; border: none; }
        #resultDisplay { 
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8); font-size: 2.0rem; font-weight: bold; color: var(--primary); 
            margin: 30px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; flex-direction: column; 
        }

        button { padding: 12px 28px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; background: var(--primary); color: white; font-weight: bold; }
        button:disabled { background: #bbb; cursor: not-allowed; }
        .btn-secondary { background: var(--secondary); }
        .btn-cancel { background: #bdbdbd; color: white; }
        .btn-confirm { background: var(--accent); color: white; }
        .btn-export { background: #2a9d8f; margin-top: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: var(--secondary); color: white; }
        .status-text { font-size: 0.85rem; color: #777; margin-top: 5px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div id="numberModal" class="modal-overlay" onclick="handleOverlayClick(event, 'numberModal')">
    <div class="modal">
        <div class="modal-header">🔢 產生名單編號</div>
        <div class="modal-body">
            <label>開頭文字：</label><input type="text" id="numPrefix" placeholder="例如：名單">
            <label>編號範圍：</label>
            <div style="display: flex; align-items: center; gap: 5px;"><input type="number" id="numStart" value="1" style="flex:1"> <span>~</span> <input type="number" id="numEnd" value="10" style="flex:1"></div>
            <label>結尾文字：</label><input type="text" id="numSuffix" placeholder="選填">
        </div>
        <div class="modal-footer"><button class="btn-cancel" onclick="closeModal('numberModal')">取消</button><button class="btn-confirm" onclick="generateNumbers()">確認</button></div>
    </div>
</div>

<div id="filterModal" class="modal-overlay" onclick="handleOverlayClick(event, 'filterModal')">
    <div class="modal">
        <div class="modal-header">🔍 關鍵字篩選</div>
        <div class="modal-body">
            <input type="text" id="filterKeyword" placeholder="輸入關鍵字">
            <div style="margin-top:15px;">
                <label><input type="radio" name="filterType" value="include" checked> 只保留包含關鍵字的名單</label><br>
                <label><input type="radio" name="filterType" value="exclude"> 移除包含關鍵字的名單</label>
            </div>
        </div>
        <div class="modal-footer"><button class="btn-cancel" onclick="closeModal('filterModal')">取消</button><button class="btn-confirm" onclick="applyFilter()">確認</button></div>
    </div>
</div>

<div id="prizeGenModal" class="modal-overlay" onclick="handleOverlayClick(event, 'prizeGenModal')">
    <div class="modal">
        <div class="modal-header">🎁 產生獎項編號</div>
        <div class="modal-body">
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">使用說明：請輸入最大獎項編號，開頭與結尾文字為選填。若數量未填，預設每個獎項抽出 1 位中獎者。</p>
            <label>獎項開頭文字：</label><input type="text" id="pGenPrefix" placeholder="例如：第">
            <label>獎項編號範圍：</label>
            <div style="display: flex; align-items: center; gap: 5px;">
                <input type="number" id="pGenStart" value="1" style="flex:1"> 
                <span>~</span> 
                <input type="number" id="pGenEnd" value="3" style="flex:1">
            </div>
            <label>獎項結尾文字：</label><input type="text" id="pGenSuffix" placeholder="例如：獎">
            <label>預設數量：</label><input type="number" id="pGenCount" value="1" min="1">
        </div>
        <div class="modal-footer"><button class="btn-cancel" onclick="closeModal('prizeGenModal')">取消</button><button class="btn-confirm" onclick="generatePrizes()">確認</button></div>
    </div>
</div>

<div class="card">
    <h2>⚙️ 第一步：活動設定</h2>
    <div class="grid">
        <div>
            <label><b>1. 抽獎名單 (一人一行)</b></label>
            <div class="toolbar">
                <button class="tool-btn" data-tip="匯入名單" onclick="document.getElementById('fileInput').click()">📁</button>
                <button class="tool-btn" data-tip="產生名單編號" onclick="openModal('numberModal')">🔢</button>
                <button class="tool-btn" data-tip="合併重複名單" onclick="listAction('unique')">✨</button>
                <button class="tool-btn" data-tip="依名稱排序" onclick="listAction('sort')">🔤</button>
                <button class="tool-btn" data-tip="隨機打亂名單" onclick="listAction('shuffle')">🎲</button>
                <button class="tool-btn" data-tip="關鍵字篩選" onclick="openModal('filterModal')">🔍</button>
                <button class="tool-btn" data-tip="清空名單" onclick="listAction('clear')" style="color: #e63946;">🗑️</button>
                <input type="file" id="fileInput" accept=".txt,.csv" style="display:none" onchange="importFile(this)">
            </div>
            <textarea id="nameInput" placeholder="輸入姓名，例如：&#10;王小月&#10;伊魯尼..."></textarea>
            <div id="nameCount" class="status-text">目前名單：0 人</div>
        </div>

        <div>
            <label><b>2. 獎項設定 (獎名,數量)</b></label>
            <div class="mode-switch-group" style="margin-top: 10px;">
                <div class="mode-btn" onclick="openModal('prizeGenModal')">🪄 產生獎項</div>
                <div id="modeFormBtn" class="mode-btn active" onclick="switchPrizeMode('form')">📝 表單編輯</div>
                <div id="modeTextBtn" class="mode-btn" onclick="switchPrizeMode('text')">📋 文字輸入</div>
            </div>

            <div id="prizeFormContainer">
                <div id="prizeRows">
                    <div class="prize-row">
                        <input type="text" class="p-name" placeholder="輸入獎品名稱">
                        <input type="number" class="p-count" placeholder="數量" min="1" value="1">
                        <button class="del-btn" onclick="removeRow(this)">✖</button>
                    </div>
                </div>
                <button type="button" class="btn-add" onclick="addRow()">+ 新增獎項項目</button>
            </div>

            <div id="prizeTextContainer" style="display: none;">
                <textarea id="prizeTextArea" placeholder="格式：獎稱,數量&#10;例如：&#10;粉色狗鍊,1&#10;狗狗飼料,2"></textarea>
            </div>

            <div id="prizeCount" class="status-text" style="margin-top:10px;">總獎項：0 個</div>
        </div>
    </div>
    <div style="text-align: center; margin-top: 20px;">
        <button onclick="initSystem()" class="btn-secondary">確認並套用設定</button>
    </div>
</div>

<div class="card control-panel">
    <h2>🎲 第二步：開始抽獎</h2>
    <div id="currentPrizeInfo" style="font-weight: bold; color: var(--secondary);">請先完成上方設定</div>
    <div id="resultDisplay">準備好抽獎了嗎?</div>
    <div class="btn-group">
        <button id="drawBtn" onclick="draw()" disabled>單次抽獎</button>
        <button id="quickDrawBtn" onclick="quickDrawAll()" class="btn-secondary" disabled>一鍵抽完所有獎項</button>
    </div>
</div>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>📜 中獎記錄</h2>
        <button onclick="exportCSV()" class="btn-export">匯出結果 (CSV)</button>
    </div>
    <table id="history">
        <thead><tr><th>序號</th><th>獎項</th><th>得獎者</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
    let participants = [];
    let prizePool = [];
    let drawCount = 0;
    let currentPrizeMode = 'form';

    // --- 獎項模式切換 ---
    function switchPrizeMode(mode) {
        currentPrizeMode = mode;
        document.getElementById('prizeFormContainer').style.display = (mode === 'form' ? 'block' : 'none');
        document.getElementById('prizeTextContainer').style.display = (mode === 'text' ? 'block' : 'none');
        document.getElementById('modeFormBtn').classList.toggle('active', mode === 'form');
        document.getElementById('modeTextBtn').classList.toggle('active', mode === 'text');
    }

    // --- 彈窗通用邏輯 ---
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function handleOverlayClick(e, id) { if(e.target.id === id) closeModal(id); }

    // --- 生成編號與名單操作 ---
    function generateNumbers() {
        const prefix = document.getElementById('numPrefix').value;
        const start = parseInt(document.getElementById('numStart').value);
        const end = parseInt(document.getElementById('numEnd').value);
        const suffix = document.getElementById('numSuffix').value;
        if (isNaN(start) || isNaN(end) || start > end) { alert("請輸入正確範圍！"); return; }
        let newList = [];
        for (let i = start; i <= end; i++) newList.push(`${prefix}${i}${suffix}`);
        document.getElementById('nameInput').value = newList.join('\n');
        updateNameCount();
        closeModal('numberModal');
    }

    // --- 產生獎項編號邏輯 (新新增) ---
    function generatePrizes() {
        const prefix = document.getElementById('pGenPrefix').value;
        const start = parseInt(document.getElementById('pGenStart').value);
        const end = parseInt(document.getElementById('pGenEnd').value);
        const suffix = document.getElementById('pGenSuffix').value;
        const count = document.getElementById('pGenCount').value || 1;

        if (isNaN(start) || isNaN(end) || start > end) { alert("請輸入正確的編號範圍！"); return; }

        let prizeList = [];
        for (let i = start; i <= end; i++) {
            prizeList.push(`${prefix}${i}${suffix},${count}`);
        }

        switchPrizeMode('text');
        document.getElementById('prizeTextArea').value = prizeList.join('\n');
        closeModal('prizeGenModal');
        alert(`已產生 ${prizeList.length} 組獎項！`);
    }

    function applyFilter() {
        const kw = document.getElementById('filterKeyword').value.trim();
        const type = document.querySelector('input[name="filterType"]:checked').value;
        if (!kw) { alert("請輸入關鍵字！"); return; }
        let input = document.getElementById('nameInput');
        let list = input.value.split('\n').map(n => n.trim()).filter(n => n !== "");
        list = list.filter(item => type === 'include' ? item.includes(kw) : !item.includes(kw));
        input.value = list.join('\n');
        updateNameCount();
        closeModal('filterModal');
    }

    function listAction(type) {
        let input = document.getElementById('nameInput');
        let list = input.value.split('\n').map(n => n.trim()).filter(n => n !== "");
        if (list.length === 0 && type !== 'clear') return;
        switch(type) {
            case 'unique': list = [...new Set(list)]; break;
            case 'sort': list.sort((a, b) => a.localeCompare(b, 'zh-Hant-TW')); break;
            case 'shuffle': list.sort(() => Math.random() - 0.5); break;
            case 'clear': if(confirm("確定要清空嗎？")) input.value = ""; updateNameCount(); return;
        }
        input.value = list.join('\n');
        updateNameCount();
    }

    function importFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { document.getElementById('nameInput').value = e.target.result; updateNameCount(); };
        reader.readAsText(file);
    }

    function updateNameCount() {
        const val = document.getElementById('nameInput').value;
        const count = val.split('\n').map(n => n.trim()).filter(n => n !== "").length;
        document.getElementById('nameCount').innerText = `目前名單：${count} 人`;
    }
    document.getElementById('nameInput').oninput = updateNameCount;

    // --- 獎項操作 ---
    function addRow() {
        const row = document.createElement('div');
        row.className = 'prize-row';
        row.innerHTML = `<input type="text" class="p-name" placeholder="輸入獎品名稱"><input type="number" class="p-count" placeholder="數量" min="1" value="1"><button class="del-btn" onclick="removeRow(this)">✖</button>`;
        document.getElementById('prizeRows').appendChild(row);
    }
    function removeRow(btn) { if (document.querySelectorAll('.prize-row').length > 1) btn.parentElement.remove(); }

    function initSystem() {
        const nameText = document.getElementById('nameInput').value.trim();
        participants = nameText.split('\n').map(n => n.trim()).filter(n => n !== "");
        prizePool = [];

        if (currentPrizeMode === 'form') {
            document.querySelectorAll('.prize-row').forEach(row => {
                const name = row.querySelector('.p-name').value.trim();
                const count = parseInt(row.querySelector('.p-count').value) || 0;
                if (name && count > 0) for (let i = 0; i < count; i++) prizePool.push(name);
            });
        } else {
            document.getElementById('prizeTextArea').value.split('\n').forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 2) {
                    const name = parts[0].trim();
                    const count = parseInt(parts[1]) || 0;
                    if (name && count > 0) for (let i = 0; i < count; i++) prizePool.push(name);
                }
            });
        }

        if (participants.length === 0 || prizePool.length === 0) { alert("請確認名單與獎項皆已填寫！"); return; }
        updateStatus();
        document.getElementById('drawBtn').disabled = false;
        document.getElementById('quickDrawBtn').disabled = false;
        document.getElementById('resultDisplay').innerText = "準備就緒！";
    }

    function updateStatus() {
        document.getElementById('nameCount').innerText = `目前名單：${participants.length} 人`;
        document.getElementById('prizeCount').innerText = `總獎項：${prizePool.length} 個`;
        document.getElementById('currentPrizeInfo').innerText = prizePool.length > 0 ? `當前抽出獎項：【${prizePool[0]}】` : "獎項已抽完！";
    }

    // --- 抽獎動畫與邏輯 ---
    function draw() {
        const res = document.getElementById('resultDisplay');
        document.getElementById('drawBtn').disabled = true;
        document.getElementById('quickDrawBtn').disabled = true;
        let counter = 0, totalTicks = 20, speed = 50;
        function runAnimation() {
            res.innerText = "🌀 " + participants[Math.floor(Math.random() * participants.length)];
            if (++counter < totalTicks) setTimeout(runAnimation, speed += 10);
            else finalizeDraw();
        }
        runAnimation();
    }

    function finalizeDraw() {
        if (participants.length === 0 || prizePool.length === 0) return;
        const winner = participants.splice(Math.floor(Math.random() * participants.length), 1)[0];
        const prize = prizePool.shift();
        drawCount++;
        document.getElementById('resultDisplay').innerHTML = `<small>恭喜獲獎！</small><div>🎉 ${winner}</div><div style="font-size:1.2rem; color:var(--secondary)">獲得：${prize}</div>`;
        addToTable(prize, winner);
        updateStatus();
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        if(prizePool.length > 0) {
            document.getElementById('drawBtn').disabled = false;
            document.getElementById('quickDrawBtn').disabled = false;
        }
    }

    function quickDrawAll() {
        if (!confirm("確定要一次抽出剩餘所有獎項嗎？")) return;
        while (prizePool.length > 0 && participants.length > 0) finalizeDraw();
        document.getElementById('resultDisplay').innerText = "全部獎項抽取完畢！";
    }

    function addToTable(prize, winner) {
        const row = document.getElementById('history').querySelector('tbody').insertRow(0);
        row.innerHTML = `<td>${drawCount}</td><td>${prize}</td><td>${winner}</td>`;
    }

    function exportCSV() {
        let csv = "\uFEFF序號,獎項,得獎者\n";
        document.querySelectorAll("#history tbody tr").forEach(tr => {
            csv += Array.from(tr.querySelectorAll("td")).map(td => td.innerText).join(",") + "\n";
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        link.download = `抽獎結果.csv`;
        link.click();
    }
</script>

</body>
</html>
