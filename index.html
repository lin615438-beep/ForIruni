<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定義抽獎系統</title>
    <style>
        :root { --primary: #e63946; --secondary: #457b9d; --bg: #f1faee; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 900px; margin-bottom: 20px; }
        h2 { color: var(--secondary); border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea { width: 100%; height: 150px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; resize: none; box-sizing: border-box; }
        .control-panel { text-align: center; padding: 20px; background: #a8dadc; border-radius: 12px; }
        #resultDisplay { font-size: 2rem; font-weight: bold; color: var(--primary); margin: 20px 0; min-height: 60px; }
        button { padding: 12px 25px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; background: var(--primary); color: white; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        button:disabled { background: #ccc; transform: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: var(--secondary); color: white; }
        .count-badge { background: var(--secondary); color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ 第一步：活動設定</h2>
    <div class="grid">
        <div>
            <label><b>1. 抽獎名單 (一人一行)</b></label>
            <textarea id="nameInput" placeholder="請輸入姓名，例如：&#10;王小月&#10;伊魯尼..."></textarea>
            <div id="nameCount" class="status">目前名單：0 人</div>
        </div>
        <div>
            <label><b>2. 獎項設定 (格式：獎名,數量)</b></label>
            <textarea id="prizeInput" placeholder="格式：獎稱,數量,例如：&#10;(注意：獎項會由上而下抽出得獎者)&#10;粉色狗鍊,1&#10;狗勾飼料,2&#10;握手券,50"></textarea>
        </div>
    </div>
    <div style="text-align: center; margin-top: 15px;">
        <button onclick="initSystem()" style="background: var(--secondary);">確認套用設定</button>
    </div>
</div>

<div class="card control-panel">
    <h2>🎲 第二步：開始抽獎</h2>
    <div id="currentPrizeInfo">請先套用設定</div>
    <div id="resultDisplay">準備好抽獎了嗎？</div>
    <button id="drawBtn" onclick="draw()" disabled>抽出一位幸運兒</button>
</div>

<div class="card">
    <h2>📜 中獎記錄</h2>
    <table id="history">
        <thead><tr><th>獎項</th><th>得獎者</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
    let participants = [];
    let prizePool = [];

    // 初始化系統
    function initSystem() {
        const nameText = document.getElementById('nameInput').value.trim();
        const prizeText = document.getElementById('prizeInput').value.trim();

        if (!nameText || !prizeText) {
            alert("請輸入名單與獎項內容！");
            return;
        }

        // 處理人名
        participants = nameText.split('\n').map(n => n.trim()).filter(n => n !== "");
        
        // 處理獎項 (展開成單個獎項陣列)
        prizePool = [];
        const prizeLines = prizeText.split('\n');
        prizeLines.forEach(line => {
            const [name, count] = line.split(',');
            const num = parseInt(count) || 1;
            for (let i = 0; i < num; i++) {
                prizePool.push(name.trim());
            }
        });

        document.getElementById('nameCount').innerText = `目前名單：${participants.length} 人`;
        document.getElementById('currentPrizeInfo').innerText = `剩餘獎項總數：${prizePool.length} 個`;
        document.getElementById('drawBtn').disabled = false;
        alert("設定成功！共有 " + participants.length + " 位參與者。");
    }

    function draw() {
        if (participants.length === 0) {
            alert("名單已空！");
            return;
        }
        if (prizePool.length === 0) {
            alert("獎項已全數抽完！");
            return;
        }

        const btn = document.getElementById('drawBtn');
        const res = document.getElementById('resultDisplay');
        btn.disabled = true;

        // 動畫效果
        let timer = 0;
        let shuffle = setInterval(() => {
            const randIdx = Math.floor(Math.random() * participants.length);
            res.innerText = "🌀 " + participants[randIdx];
            timer++;
            if (timer > 10) {
                clearInterval(shuffle);
                finalize();
            }
        }, 100);

        function finalize() {
            const pIdx = Math.floor(Math.random() * participants.length);
            const winner = participants.splice(pIdx, 1)[0]; // 移除已中獎者
            const prize = prizePool.shift(); // 取出目前最高順位的獎項

            res.innerHTML = `🎉 <span style="color:#e63946">${winner}</span><br><small>獲得：${prize}</small>`;
            
            // 記錄到表格
            const table = document.getElementById('history').getElementsByTagName('tbody')[0];
            const row = table.insertRow(0);
            row.insertCell(0).innerText = prize;
            row.insertCell(1).innerText = winner;

            // 更新狀態
            document.getElementById('nameCount').innerText = `目前名單：${participants.length} 人`;
            document.getElementById('currentPrizeInfo').innerText = `下一個獎項：${prizePool[0] || '無'} (剩餘 ${prizePool.length} 個)`;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
